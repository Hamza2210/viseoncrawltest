<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Contact</title>
<style>
body{font-family:system-ui,Arial,sans-serif;max-width:900px;margin:40px auto;padding:0 16px;line-height:1.5}
nav a{margin-right:14px}
.card{border:1px solid #ddd;border-radius:12px;padding:18px}
input,textarea{width:100%;padding:10px;border:1px solid #ccc;border-radius:8px;margin-top:6px}
button{margin-top:10px;padding:10px 14px;border-radius:10px;border:1px solid #ccc}
</style>
<link rel="canonical" href="https://example.com/contact.html" />

<!-- Social meta (Open Graph + Twitter) -->
<meta property="og:type" content="website" />
<meta property="og:site_name" content="VISEON Crawl Test" />
<meta property="og:title" content="Contact — VISEON Crawl Test" />
<meta property="og:description" content="Contact page with a demo form, for demonstration purposes only." />
<meta property="og:url" content="https://example.com/contact.html" />
<meta property="og:image" content="https://example.com/logo.png" />
<meta name="twitter:card" content="summary" />
<meta name="twitter:title" content="Contact — VISEON Crawl Test" />
<meta name="twitter:description" content="Contact page with a demo form, for demonstration purposes only." />

<!-- Structured data (schema.org JSON-LD) -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {
      "@type": "Organization",
      "@id": "https://example.com/#organization",
      "name": "VISEON",
      "url": "https://example.com/",
      "logo": {
        "@type": "ImageObject",
        "@id": "https://example.com/#logo",
        "url": "https://example.com/logo.png",
        "contentUrl": "https://example.com/logo.png",
        "caption": "VISEON"
      },
      "image": { "@id": "https://example.com/#logo" },
      "description": "VISEON is a test web property used to validate static hosting on AWS S3 behind a Cloudflare proxy.",
      "email": "hello@example.com",
      "contactPoint": {
        "@type": "ContactPoint",
        "contactType": "customer support",
        "email": "hello@example.com",
        "availableLanguage": ["English"]
      },
      "sameAs": ["https://github.com/VISEONIO"]
    },
    {
      "@type": "WebSite",
      "@id": "https://example.com/#website",
      "url": "https://example.com/",
      "name": "VISEON Crawl Test",
      "description": "A simple static website for testing S3 static hosting with Cloudflare.",
      "publisher": { "@id": "https://example.com/#organization" },
      "inLanguage": "en"
    },
    {
      "@type": "ContactPage",
      "@id": "https://example.com/contact.html#webpage",
      "url": "https://example.com/contact.html",
      "name": "Contact",
      "isPartOf": { "@id": "https://example.com/#website" },
      "about": { "@id": "https://example.com/#organization" },
      "description": "Contact page with a demo form. For demonstration purposes only.",
      "inLanguage": "en",
      "breadcrumb": { "@id": "https://example.com/contact.html#breadcrumb" },
      "mainEntity": { "@id": "https://example.com/#organization" }
    },
    {
      "@type": "BreadcrumbList",
      "@id": "https://example.com/contact.html#breadcrumb",
      "itemListElement": [
        { "@type": "ListItem", "position": 1, "name": "Home", "item": "https://example.com/index.html" },
        { "@type": "ListItem", "position": 2, "name": "Contact", "item": "https://example.com/contact.html" }
      ]
    }
  ]
}
</script>
</head>
<body>
<nav>
<a href="index.html">Home</a>
<a href="about.html">About</a>
<a href="services.html">Services</a>

</nav>

<h1>Contact</h1>
<div class="card">
<p>This form is only for demo purposes.</p>
<form onsubmit="event.preventDefault(); alert('Demo form submitted');">
<label>Name</label>
<input placeholder="Your name">
<label>Email</label>
<input placeholder="your@email.com">
<label>Message</label>
<textarea rows="4" placeholder="Your message"></textarea>
<button type="submit">Send</button>
</form>
</div>
</body>
</html>
