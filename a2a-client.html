<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>A2A Client · GdayJames</title>

  <!-- Typography: Fraunces (display serif) + Newsreader (body serif) + JetBrains Mono (metadata) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Newsreader:ital,wght@0,400;0,500;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg:            #f6f1e7;
      --bg-raised:     #fbf7ee;
      --ink:           #1a1a1a;
      --ink-soft:      #3d3d3d;
      --ink-mute:      #8a847a;
      --rule:          #d9d1c0;
      --accent:        #7a3b2e;          /* warm oxblood */
      --accent-soft:   #e8d8c9;
      --user-bubble:   #efe6d3;
      --agent-bubble:  #ffffff;
      --error:         #9a3a24;
      --error-bg:      #f5e4dc;

      --font-display:  'Fraunces', Georgia, serif;
      --font-body:     'Newsreader', Georgia, serif;
      --font-mono:     'JetBrains Mono', ui-monospace, Menlo, monospace;

      --max:           760px;
      --radius:        10px;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font-body);
      font-size: 17px;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ────────────────────────────────────────────────────────────── */
    header {
      border-bottom: 1px solid var(--rule);
      padding: 20px 28px 18px;
      background: var(--bg-raised);
    }

    .header-inner {
      max-width: var(--max);
      margin: 0 auto;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 24px;
    }

    .title {
      font-family: var(--font-display);
      font-weight: 500;
      font-variation-settings: 'opsz' 80;
      font-size: 26px;
      line-height: 1.1;
      letter-spacing: -0.01em;
      margin: 0 0 2px;
    }
    .title em {
      font-style: italic;
      color: var(--accent);
      font-weight: 400;
    }

    .subtitle {
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--ink-mute);
    }

    /* Agent-card URL field */
    .card-field {
      flex: 1 1 380px;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      align-items: flex-end;
    }
    .card-field label {
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--ink-mute);
    }
    .card-field-row {
      display: flex;
      gap: 6px;
      width: 100%;
    }
    .card-field input {
      flex: 1;
      font-family: var(--font-mono);
      font-size: 12px;
      padding: 7px 10px;
      background: var(--bg);
      border: 1px solid var(--rule);
      border-radius: 6px;
      color: var(--ink);
    }
    .card-field input:focus {
      outline: none;
      border-color: var(--accent);
    }
    .card-field button {
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      padding: 7px 14px;
      background: var(--ink);
      color: var(--bg-raised);
      border: 1px solid var(--ink);
      border-radius: 6px;
      cursor: pointer;
    }
    .card-field button:hover {
      background: var(--accent);
      border-color: var(--accent);
    }

    /* ── Agent strip (shown when card loads) ──────────────────────────────── */
    .agent-strip {
      max-width: var(--max);
      margin: 18px auto 0;
      padding: 14px 0 0;
      border-top: 1px dashed var(--rule);
      display: none;
    }
    .agent-strip.active { display: block; }

    .agent-strip .name {
      font-family: var(--font-display);
      font-style: italic;
      font-size: 20px;
      color: var(--ink);
      margin: 0 0 2px;
    }
    .agent-strip .desc {
      font-size: 14px;
      color: var(--ink-soft);
      margin: 0 0 10px;
      max-width: 56em;
    }
    .agent-strip .meta {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--ink-mute);
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
    }
    .agent-strip .meta .sep { color: var(--rule); }
    .agent-strip .skills {
      margin-top: 10px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .agent-strip .skill-pill {
      font-family: var(--font-mono);
      font-size: 11px;
      padding: 3px 9px;
      background: var(--accent-soft);
      color: var(--accent);
      border-radius: 999px;
    }

    /* ── Main: chat region ───────────────────────────────────────────────── */
    main {
      flex: 1;
      overflow-y: auto;
      padding: 36px 28px 140px;
    }
    .chat {
      max-width: var(--max);
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 22px;
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--ink-mute);
    }
    .empty-state .big {
      font-family: var(--font-display);
      font-size: 22px;
      font-style: italic;
      color: var(--ink-soft);
      margin: 0 0 8px;
    }
    .empty-state .small {
      font-family: var(--font-mono);
      font-size: 12px;
      letter-spacing: 0.04em;
    }

    /* ── Message bubbles ─────────────────────────────────────────────────── */
    .msg {
      display: flex;
      flex-direction: column;
      gap: 6px;
      animation: appear 260ms ease-out;
    }
    @keyframes appear {
      from { opacity: 0; transform: translateY(4px); }
      to   { opacity: 1; transform: none; }
    }

    .msg .role {
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--ink-mute);
    }

    .msg.user { align-items: flex-end; }
    .msg.user .bubble {
      background: var(--user-bubble);
      border: 1px solid var(--rule);
      color: var(--ink);
      max-width: 85%;
      padding: 12px 16px;
      border-radius: var(--radius);
      border-top-right-radius: 3px;
      white-space: pre-wrap;
      word-wrap: break-word;
    }
    .msg.user .role { padding-right: 4px; }

    .msg.agent .bubble {
      background: var(--agent-bubble);
      border: 1px solid var(--rule);
      padding: 16px 20px;
      border-radius: var(--radius);
      border-top-left-radius: 3px;
      font-size: 17.5px;
      line-height: 1.65;
    }
    .msg.agent .bubble p { margin: 0 0 0.9em; }
    .msg.agent .bubble p:last-child { margin-bottom: 0; }
    .msg.agent .bubble a {
      color: var(--accent);
      text-decoration: underline;
      text-decoration-thickness: 1px;
      text-underline-offset: 2px;
    }
    .msg.agent .bubble code {
      font-family: var(--font-mono);
      font-size: 0.88em;
      background: var(--bg);
      padding: 1px 5px;
      border-radius: 3px;
    }
    .msg.agent .bubble pre {
      font-family: var(--font-mono);
      font-size: 13px;
      background: var(--bg);
      padding: 12px 14px;
      border-radius: 6px;
      overflow-x: auto;
      line-height: 1.5;
    }

    .msg-meta {
      font-family: var(--font-mono);
      font-size: 10.5px;
      color: var(--ink-mute);
      margin-top: 2px;
      padding-left: 4px;
    }
    .msg-meta .pill {
      display: inline-block;
      padding: 1px 6px;
      background: var(--accent-soft);
      color: var(--accent);
      border-radius: 999px;
      margin-right: 6px;
    }

    /* Error message */
    .msg.error .bubble {
      background: var(--error-bg);
      border: 1px solid var(--error);
      color: var(--error);
      font-family: var(--font-mono);
      font-size: 13px;
      max-width: 100%;
      padding: 12px 14px;
      white-space: pre-wrap;
    }

    /* Loading indicator */
    .msg.pending .bubble {
      display: flex;
      gap: 5px;
      padding: 18px 20px;
    }
    .msg.pending .dot {
      width: 6px; height: 6px;
      background: var(--ink-mute);
      border-radius: 50%;
      animation: pulse 1.2s ease-in-out infinite;
    }
    .msg.pending .dot:nth-child(2) { animation-delay: 0.15s; }
    .msg.pending .dot:nth-child(3) { animation-delay: 0.3s; }
    @keyframes pulse {
      0%, 60%, 100% { opacity: 0.25; }
      30% { opacity: 1; }
    }

    /* ── Composer ────────────────────────────────────────────────────────── */
    .composer {
      position: fixed;
      left: 0; right: 0; bottom: 0;
      background: linear-gradient(to bottom, transparent, var(--bg) 30%);
      padding: 40px 28px 20px;
      pointer-events: none;
    }
    .composer-inner {
      max-width: var(--max);
      margin: 0 auto;
      display: flex;
      gap: 10px;
      align-items: flex-end;
      pointer-events: auto;
    }
    .composer textarea {
      flex: 1;
      resize: none;
      min-height: 52px;
      max-height: 180px;
      padding: 15px 18px;
      background: var(--bg-raised);
      border: 1px solid var(--rule);
      border-radius: 26px;
      font-family: var(--font-body);
      font-size: 16.5px;
      line-height: 1.45;
      color: var(--ink);
      box-shadow: 0 4px 18px rgba(26, 26, 26, 0.06);
    }
    .composer textarea:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 4px 22px rgba(122, 59, 46, 0.12);
    }
    .composer textarea::placeholder {
      color: var(--ink-mute);
      font-style: italic;
    }
    .composer textarea:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .composer button {
      padding: 0 22px;
      height: 52px;
      background: var(--ink);
      color: var(--bg-raised);
      border: none;
      border-radius: 26px;
      font-family: var(--font-mono);
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.15s;
    }
    .composer button:hover:not(:disabled) { background: var(--accent); }
    .composer button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    /* ── Small screens ──────────────────────────────────────────────────── */
    @media (max-width: 680px) {
      header { padding: 16px 18px 14px; }
      .header-inner { flex-direction: column; gap: 12px; }
      .card-field { align-items: flex-start; max-width: 100%; }
      main { padding: 24px 18px 140px; }
      .composer { padding: 30px 18px 16px; }
    }
  </style>
</head>
<body>

  <header>
    <div class="header-inner">
      <div>
        <h1 class="title">a2a · <em>client</em></h1>
        <div class="subtitle">agent-to-agent · text terminal</div>
      </div>

      <div class="card-field">
        <label for="card-url">Agent card URL</label>
        <div class="card-field-row">
          <input
            id="card-url"
            type="url"
            spellcheck="false"
            placeholder="https://example.com/.well-known/agent-card.json"
            value="https://viseoncrawltest.uk/api/router-a2a"
          >
          <button id="card-load" type="button">Connect</button>
        </div>
      </div>
    </div>

    <div id="agent-strip" class="agent-strip">
      <div class="name" id="agent-name">—</div>
      <div class="desc"  id="agent-desc">—</div>
      <div class="meta"  id="agent-meta"></div>
      <div class="skills" id="agent-skills"></div>
    </div>
  </header>

  <main>
    <div class="chat" id="chat">
      <div class="empty-state" id="empty-state">
        <div class="big">Type a message to begin.</div>
        <div class="small">Requests flow as a2a v0.3.0 · message/send · json-rpc 2.0</div>
      </div>
    </div>
  </main>

  <div class="composer">
    <div class="composer-inner">
      <textarea
        id="input"
        rows="1"
        placeholder="Ask something…"
        disabled
      ></textarea>
      <button id="send" type="button" disabled>Send</button>
    </div>
  </div>

  <script>
    /* ──────────────────────────────────────────────────────────────────────
     * A2A Client — single-file.
     *
     * Discovers an agent via its agent-card URL, then sends chat turns as
     * JSON-RPC 2.0 `message/send` requests to card.url. Skill selection is
     * left to the server (no metadata.skillId on outgoing messages).
     *
     * State model:
     *   - agentCard: parsed JSON of the card
     *   - endpoint:  card.url — where message/send goes
     *   - contextId: stable across a session, so the server can thread turns
     *   - history:   [{role, content}, ...] sent as metadata.history each turn
     * ────────────────────────────────────────────────────────────────────── */

    const els = {
      cardUrl:    document.getElementById('card-url'),
      cardLoad:   document.getElementById('card-load'),
      agentStrip: document.getElementById('agent-strip'),
      agentName:  document.getElementById('agent-name'),
      agentDesc:  document.getElementById('agent-desc'),
      agentMeta:  document.getElementById('agent-meta'),
      agentSkills:document.getElementById('agent-skills'),
      chat:       document.getElementById('chat'),
      empty:      document.getElementById('empty-state'),
      input:      document.getElementById('input'),
      send:       document.getElementById('send'),
    };

    const state = {
      agentCard: null,
      endpoint:  null,
      contextId: crypto.randomUUID(),
      history:   [],   // [{role: 'user'|'assistant', content: string}]
    };

    /* ── Agent card discovery ──────────────────────────────────────────── */

    async function loadAgentCard(url) {
      let resp;
      try {
        resp = await fetch(url, {
          method: 'GET',
          headers: { 'accept': 'application/json' },
        });
      } catch (e) {
        throw new Error(`Could not reach ${url} — ${e.message}`);
      }
      if (!resp.ok) {
        throw new Error(`${url} returned HTTP ${resp.status}`);
      }
      let card;
      try {
        card = await resp.json();
      } catch (e) {
        throw new Error(`Response from ${url} was not valid JSON`);
      }
      if (!card.url || !card.name || !Array.isArray(card.skills)) {
        throw new Error('Response does not look like an A2A agent card (missing name, url, or skills)');
      }
      return card;
    }

    function renderAgentStrip(card) {
      els.agentName.textContent = card.name;
      els.agentDesc.textContent = card.description || '';

      const meta = [];
      if (card.version)         meta.push(`v${card.version}`);
      if (card.provider?.organization) meta.push(card.provider.organization);
      if (card.protocolVersion) meta.push(`a2a ${card.protocolVersion}`);
      if (card.preferredTransport) meta.push(card.preferredTransport.toLowerCase());
      els.agentMeta.innerHTML = meta
        .map((m, i) => (i > 0 ? '<span class="sep">·</span> ' : '') + escapeHtml(m))
        .join(' ');

      els.agentSkills.innerHTML = card.skills
        .map(s => `<span class="skill-pill">${escapeHtml(s.id || s.name || '—')}</span>`)
        .join('');

      els.agentStrip.classList.add('active');
    }

    /* ── Sending messages ──────────────────────────────────────────────── */

    async function sendMessage(text) {
      if (!state.endpoint) {
        throw new Error('Not connected to an agent yet.');
      }

      const body = {
        jsonrpc: '2.0',
        id:      crypto.randomUUID(),
        method:  'message/send',
        params: {
          message: {
            kind:       'message',
            messageId:  crypto.randomUUID(),
            role:       'user',
            contextId:  state.contextId,
            parts:      [{ kind: 'text', text }],
            // Multi-turn: pass accumulated history via metadata. Our GdayJames
            // worker reads message.metadata.history. Other A2A servers may
            // ignore it, which is fine — they'll just treat each turn as new.
            metadata: {
              history: state.history,
            },
          },
        },
      };

      const resp = await fetch(state.endpoint, {
        method: 'POST',
        headers: {
          'content-type': 'application/json',
          'accept':       'application/json',
        },
        body: JSON.stringify(body),
      });

      // JSON-RPC errors come back with HTTP 200 per A2A spec, but some agents
      // might return 4xx/5xx anyway. Either way, try to parse JSON first.
      let data;
      try {
        data = await resp.json();
      } catch (e) {
        throw new Error(`Non-JSON response (HTTP ${resp.status})`);
      }

      if (data.error) {
        const err = new Error(data.error.message || 'Agent returned an error');
        err.code = data.error.code;
        err.data = data.error.data;
        throw err;
      }

      return data.result;
    }

    /* ── Extracting text from an A2A response ──────────────────────────── */
    // The server might return either a Message (direct response) or a Task
    // (with artifacts). Handle both.
    function extractReply(result) {
      const out = { text: '', skillId: null, extras: null };

      // Direct message response
      if (result?.kind === 'message' && Array.isArray(result.parts)) {
        out.text = partsToText(result.parts);
        out.skillId = result.metadata?.skillId || null;
        out.extras  = collectExtras(result.metadata);
        return out;
      }

      // Task response with artifacts
      if (result?.kind === 'task' && Array.isArray(result.artifacts)) {
        const artifact = result.artifacts[0];
        if (artifact?.parts) {
          out.text = partsToText(artifact.parts);
          out.skillId = artifact.metadata?.skillId || null;
          out.extras  = collectExtras(artifact.metadata);
        }
        return out;
      }

      out.text = '(empty response)';
      return out;
    }

    function partsToText(parts) {
      return parts
        .filter(p => (p.kind === 'text' || p.type === 'text') && typeof p.text === 'string')
        .map(p => p.text)
        .join('\n\n');
    }

    function collectExtras(metadata) {
      if (!metadata) return null;
      const keys = ['search_source', 'query_mode', 'engine'];
      const picked = {};
      for (const k of keys) {
        if (metadata[k] != null) picked[k] = metadata[k];
      }
      return Object.keys(picked).length ? picked : null;
    }

    /* ── Rendering turns ───────────────────────────────────────────────── */

    function renderUserTurn(text) {
      hideEmpty();
      const el = document.createElement('div');
      el.className = 'msg user';
      el.innerHTML = `
        <div class="role">you</div>
        <div class="bubble"></div>
      `;
      el.querySelector('.bubble').textContent = text;
      els.chat.appendChild(el);
      scrollToBottom();
    }

    function renderPending() {
      hideEmpty();
      const el = document.createElement('div');
      el.className = 'msg agent pending';
      el.innerHTML = `
        <div class="role">${escapeHtml(state.agentCard?.name || 'agent')}</div>
        <div class="bubble">
          <span class="dot"></span><span class="dot"></span><span class="dot"></span>
        </div>
      `;
      els.chat.appendChild(el);
      scrollToBottom();
      return el;
    }

    function renderAgentTurn(pendingEl, reply) {
      pendingEl.classList.remove('pending');

      const bubble = pendingEl.querySelector('.bubble');
      bubble.innerHTML = markdownish(reply.text);

      if (reply.skillId || reply.extras) {
        const meta = document.createElement('div');
        meta.className = 'msg-meta';
        const bits = [];
        if (reply.skillId) {
          bits.push(`<span class="pill">${escapeHtml(reply.skillId)}</span>`);
        }
        if (reply.extras) {
          for (const [k, v] of Object.entries(reply.extras)) {
            bits.push(`${escapeHtml(k)}: ${escapeHtml(String(v))}`);
          }
        }
        meta.innerHTML = bits.join(' · ');
        pendingEl.appendChild(meta);
      }

      scrollToBottom();
    }

    function renderError(pendingEl, err) {
      pendingEl.classList.remove('pending', 'agent');
      pendingEl.classList.add('error');
      const bubble = pendingEl.querySelector('.bubble');
      bubble.innerHTML = '';
      const code = err.code != null ? ` [${err.code}]` : '';
      bubble.textContent = `error${code}: ${err.message}`;
      scrollToBottom();
    }

    /* ── Tiny markdown-ish renderer ────────────────────────────────────── */
    // Deliberately minimal: paragraphs, bold, italic, inline code, links.
    // Good enough for LLM prose; doesn't pretend to be a full renderer.
    function markdownish(text) {
      const paragraphs = escapeHtml(text).split(/\n\s*\n/);
      return paragraphs
        .map(para => {
          let p = para
            .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
            .replace(/\*([^*]+)\*/g, '<em>$1</em>')
            .replace(/`([^`]+)`/g, '<code>$1</code>')
            .replace(
              /\[([^\]]+)\]\((https?:\/\/[^)]+)\)/g,
              '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>'
            )
            .replace(/\n/g, '<br>');
          return `<p>${p}</p>`;
        })
        .join('');
    }

    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    /* ── Utilities ─────────────────────────────────────────────────────── */

    function hideEmpty() {
      if (els.empty) els.empty.style.display = 'none';
    }

    function scrollToBottom() {
      const main = document.querySelector('main');
      requestAnimationFrame(() => {
        main.scrollTop = main.scrollHeight;
      });
    }

    function autoResizeTextarea() {
      els.input.style.height = 'auto';
      els.input.style.height = Math.min(els.input.scrollHeight, 180) + 'px';
    }

    /* ── Flow: connect ─────────────────────────────────────────────────── */

    async function handleConnect() {
      const url = els.cardUrl.value.trim();
      if (!url) return;

      els.cardLoad.disabled = true;
      els.cardLoad.textContent = '...';

      try {
        const card = await loadAgentCard(url);

        state.agentCard = card;
        state.endpoint  = card.url;
        state.contextId = crypto.randomUUID();  // new session on reconnect
        state.history   = [];

        // Reset chat
        els.chat.innerHTML = '';
        els.empty.style.display = '';
        els.empty.querySelector('.big').textContent = `Connected to ${card.name}.`;
        els.empty.querySelector('.small').textContent = 'type a message to begin';

        renderAgentStrip(card);

        els.input.disabled = false;
        els.send.disabled  = false;
        els.input.focus();
      } catch (e) {
        alert(`Couldn't load agent card:\n${e.message}`);
      } finally {
        els.cardLoad.disabled = false;
        els.cardLoad.textContent = 'Connect';
      }
    }

    /* ── Flow: send a turn ─────────────────────────────────────────────── */

    async function handleSend() {
      const text = els.input.value.trim();
      if (!text) return;

      els.input.value = '';
      autoResizeTextarea();
      els.input.disabled = true;
      els.send.disabled  = true;

      renderUserTurn(text);
      const pending = renderPending();

      try {
        const result = await sendMessage(text);
        const reply  = extractReply(result);

        renderAgentTurn(pending, reply);

        // Append both turns to history so the next request has context.
        state.history.push({ role: 'user',      content: text });
        state.history.push({ role: 'assistant', content: reply.text });

        // Don't let history grow without bound. The worker already caps at 4
        // turns internally, so 12 entries (6 exchanges) is plenty.
        if (state.history.length > 12) {
          state.history = state.history.slice(-12);
        }
      } catch (e) {
        renderError(pending, e);
      } finally {
        els.input.disabled = false;
        els.send.disabled  = false;
        els.input.focus();
      }
    }

    /* ── Event wiring ──────────────────────────────────────────────────── */

    els.cardLoad.addEventListener('click', handleConnect);
    els.cardUrl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); handleConnect(); }
    });

    els.send.addEventListener('click', handleSend);
    els.input.addEventListener('keydown', (e) => {
      // Enter to send, Shift+Enter for newline (standard chat behaviour)
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        handleSend();
      }
    });
    els.input.addEventListener('input', autoResizeTextarea);

    // Auto-connect to the default URL on load
    window.addEventListener('load', () => handleConnect());
  </script>

</body>
</html>
