<title>AskJames</title>

<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --accent: #3468e8;
  --text: #1a1a1a;
  --muted: #888;
  --border: rgba(0,0,0,0.08);
  --bubble-ai: #f7f8fc;
  --bubble-user-bg: #3468e8;
  --bubble-user-text: #fff;
}

body {
  font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
  background: #fff;
  color: var(--text);
  height: 100dvh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  position: relative;
}

/* ── Top bar with settings button ── */
.topbar {
  display: flex;
  justify-content: flex-end;
  align-items: center;
  padding: 10px 20px 0;
  flex-shrink: 0;
}

.settings-btn {
  background: none;
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 6px 12px;
  font-family: inherit;
  font-size: 13px;
  font-weight: 500;
  color: var(--muted);
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 6px;
  transition: border-color 0.15s, color 0.15s, background 0.15s;
}

.settings-btn:hover {
  border-color: var(--accent);
  color: var(--accent);
  background: rgba(52,104,232,0.04);
}

.settings-btn svg {
  flex-shrink: 0;
}

/* active filter badge */
.filter-badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: var(--accent);
  color: #fff;
  border-radius: 999px;
  font-size: 11px;
  font-weight: 700;
  min-width: 18px;
  height: 18px;
  padding: 0 5px;
  margin-left: 2px;
}

/* ── Modal overlay ── */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.35);
  backdrop-filter: blur(3px);
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s ease;
}

.modal-overlay.open {
  opacity: 1;
  pointer-events: all;
}

.modal {
  background: #fff;
  border-radius: 20px;
  width: min(480px, calc(100vw - 32px));
  max-height: min(600px, calc(100dvh - 48px));
  display: flex;
  flex-direction: column;
  box-shadow: 0 24px 64px rgba(0,0,0,0.18);
  transform: translateY(10px) scale(0.98);
  transition: transform 0.2s ease;
}

.modal-overlay.open .modal {
  transform: translateY(0) scale(1);
}

.modal-header {
  padding: 20px 22px 16px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
}

.modal-header h3 {
  font-size: 15px;
  font-weight: 700;
  color: var(--text);
}

.modal-header p {
  font-size: 12px;
  color: var(--muted);
  margin-top: 2px;
  font-weight: 400;
}

.modal-close {
  background: none;
  border: none;
  cursor: pointer;
  color: var(--muted);
  padding: 4px;
  border-radius: 6px;
  display: flex;
  align-items: center;
  transition: color 0.15s, background 0.15s;
}

.modal-close:hover {
  color: var(--text);
  background: rgba(0,0,0,0.05);
}

.modal-actions-top {
  padding: 10px 22px 8px;
  display: flex;
  gap: 10px;
  flex-shrink: 0;
  border-bottom: 1px solid var(--border);
}

.modal-action-link {
  background: none;
  border: none;
  font-family: inherit;
  font-size: 12px;
  font-weight: 600;
  color: var(--accent);
  cursor: pointer;
  padding: 0;
}

.modal-action-link:hover { text-decoration: underline; }

.modal-body {
  overflow-y: auto;
  padding: 12px 22px 8px;
  flex: 1;
}

.modal-body::-webkit-scrollbar { width: 4px; }
.modal-body::-webkit-scrollbar-thumb { background: rgba(0,0,0,.12); border-radius: 4px; }

.schema-type-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 4px;
  border-bottom: 1px solid rgba(0,0,0,0.04);
  cursor: pointer;
  border-radius: 6px;
  transition: background 0.1s;
}

.schema-type-item:last-child { border-bottom: none; }

.schema-type-item:hover { background: rgba(52,104,232,0.04); }

.schema-type-item input[type="checkbox"] {
  width: 16px;
  height: 16px;
  accent-color: var(--accent);
  cursor: pointer;
  flex-shrink: 0;
}

.schema-type-label {
  font-size: 13.5px;
  font-weight: 500;
  color: var(--text);
  flex: 1;
  user-select: none;
}

.schema-type-desc {
  font-size: 11.5px;
  color: var(--muted);
  user-select: none;
}

.modal-footer {
  padding: 14px 22px;
  border-top: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
  gap: 10px;
}

.modal-footer-note {
  font-size: 11.5px;
  color: var(--muted);
  flex: 1;
}

.modal-footer-note span {
  font-weight: 600;
  color: var(--accent);
}

.btn-apply {
  background: var(--accent);
  color: #fff;
  border: none;
  border-radius: 10px;
  padding: 9px 20px;
  font-family: inherit;
  font-size: 13.5px;
  font-weight: 600;
  cursor: pointer;
  transition: background 0.15s, transform 0.1s;
  flex-shrink: 0;
}

.btn-apply:hover { background: #2554cc; transform: scale(1.02); }

/* ── Welcome ── */
.welcome {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 40px 24px 80px;
  gap: 12px;
  transition: opacity 0.35s ease, transform 0.35s ease;
}

.welcome.hidden { display: none; }

.welcome-logo {
  height: 110px;
  width: auto;
  margin-bottom: 18px;
  mix-blend-mode: multiply;
}

.welcome h2 {
  font-size: clamp(26px, 4vw, 38px);
  font-weight: 700;
  letter-spacing: -0.035em;
  color: var(--text);
  text-align: center;
  line-height: 1.15;
}

.welcome p {
  font-size: 15px;
  color: #a0a0a8;
  text-align: center;
  max-width: 420px;
  line-height: 1.6;
  font-weight: 400;
}

/* active filter notice on welcome screen */
.filter-notice {
  display: none;
  align-items: center;
  gap: 6px;
  background: rgba(52,104,232,0.07);
  border: 1px solid rgba(52,104,232,0.18);
  border-radius: 10px;
  padding: 7px 13px;
  font-size: 12.5px;
  color: var(--accent);
  font-weight: 500;
  margin-top: 4px;
}

.filter-notice.visible { display: flex; }

/* ── Messages ── */
.msgs {
  flex: 1;
  overflow-y: auto;
  padding: 24px 0 8px;
  display: none;
  flex-direction: column;
  gap: 0;
  scroll-behavior: smooth;
}

.msgs::-webkit-scrollbar { width: 4px; }
.msgs::-webkit-scrollbar-thumb { background: rgba(0,0,0,.12); border-radius: 4px; }

.row {
  display: flex;
  padding: 6px 0;
  animation: fadeUp 0.2s ease both;
}

.meta {
  margin-top: 6px;
  padding-top: 6px;
  border-top: 1px solid rgba(0,0,0,0.06);
  font-size: 12px;
  color: var(--muted);
  white-space: normal;
  line-height: 1.45;
}

.meta a { color: var(--accent); text-decoration: none; }
.meta a:hover { text-decoration: underline; }

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(8px); }
  to   { opacity: 1; transform: translateY(0); }
}

.row.ai  { justify-content: flex-start; }
.row.me  { justify-content: flex-end; }

.row-inner {
  width: 100%;
  max-width: 760px;
  margin: 0 auto;
  padding: 0 24px;
  display: flex;
  align-items: flex-start;
  gap: 12px;
}

.row.me .row-inner { justify-content: flex-end; }

.avatar {
  width: 78px;
  height: 78px;
  border-radius: 50%;
  flex-shrink: 0;
  overflow: hidden;
  border: 1px solid rgba(52,104,232,0.28);
  background: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-top: 2px;
}

.avatar img { width: 90%; height: 90%; object-fit: contain; }

.bubble-col {
  display: flex;
  flex-direction: column;
  gap: 3px;
  max-width: 80%;
}

.row.ai .bubble-col { align-items: flex-start; }
.row.me .bubble-col { align-items: flex-end; }

.bubble {
  padding: 11px 16px;
  border-radius: 18px;
  line-height: 1.6;
  font-size: 14.5px;
  word-break: break-word;
}

.row.ai .bubble {
  background: var(--bubble-ai);
  border: 1px solid var(--border);
  border-top-left-radius: 4px;
  color: var(--text);
  white-space: normal;
}

.row.me .bubble {
  background: var(--bubble-user-bg);
  color: var(--bubble-user-text);
  border-bottom-right-radius: 4px;
  white-space: pre-wrap;
}

/* Markdown styles scoped to AI bubbles */
.row.ai .bubble p          { margin: 0 0 0.5em; }
.row.ai .bubble p:last-child { margin-bottom: 0; }
.row.ai .bubble ul,
.row.ai .bubble ol         { margin: 0.25em 0 0.5em 1.2em; }
.row.ai .bubble li         { margin-bottom: 0.2em; }
.row.ai .bubble h1,
.row.ai .bubble h2,
.row.ai .bubble h3         { margin: 0.4em 0 0.2em; font-size: 1em; font-weight: 700; }
.row.ai .bubble strong     { font-weight: 600; }
.row.ai .bubble code       { font-size: 0.9em; background: rgba(0,0,0,0.06); padding: 1px 4px; border-radius: 3px; }

/* Markdown tables — used for Exploding Dots machines (1←10, 1←2 etc.)
   and Area Model layouts. The model emits GitHub-flavoured pipe tables;
   without this CSS the browser renders them as borderless inline content
   and the dot/tod columns collapse into a single run of text. */
.row.ai .bubble table {
  border-collapse: collapse;
  margin: 0.5em 0 0.7em;
  font-size: 0.95em;
  font-variant-numeric: tabular-nums;
}
.row.ai .bubble th,
.row.ai .bubble td {
  border: 1px solid rgba(0,0,0,0.18);
  padding: 5px 9px;
  text-align: center;
  vertical-align: middle;
  white-space: nowrap;
}
.row.ai .bubble th {
  background: rgba(0,0,0,0.04);
  font-weight: 600;
}
/* Horizontal scroll on narrow screens rather than column-squashing. */
.row.ai .bubble {
  overflow-x: auto;
}

.msg-time {
  font-size: 11px;
  color: rgba(0,0,0,0.3);
  padding: 0 4px;
  align-self: flex-end;
}

.bubble.pending-bubble {
  padding: 6px 10px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 0;
  height: auto;
  overflow: hidden;
}

.pending {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 36px;
  height: 36px;
}

.pending-logo {
  position: relative;
  width: 36px;
  height: 36px;
  display: block;
  overflow: hidden;
}

.pending-logo img {
  position: absolute;
  inset: 0;
  width: 36px;
  height: 36px;
  object-fit: contain;
  backface-visibility: hidden;
  transform-origin: center;
  opacity: 0;
  animation: logoFlip 1.6s infinite ease-in-out;
}

.pending-logo img:nth-child(2) { animation-delay: 0.8s; }

@keyframes logoFlip {
  0%   { opacity: 0; transform: rotateY(90deg) scale(0.92); }
  15%  { opacity: 1; transform: rotateY(0deg) scale(1); }
  40%  { opacity: 1; transform: rotateY(0deg) scale(1); }
  50%  { opacity: 0; transform: rotateY(-90deg) scale(0.92); }
  100% { opacity: 0; transform: rotateY(-90deg) scale(0.92); }
}

/* ── Composer ── */
.composer-wrap {
  padding: 10px 24px 24px;
  flex-shrink: 0;
}

.composer-inner {
  max-width: 760px;
  margin: 0 auto;
}

.composer {
  display: flex;
  align-items: flex-end;
  background: #fff;
  border: 1.5px solid rgba(0,0,0,0.11);
  border-radius: 18px;
  padding: 6px 6px 6px 18px;
  transition: border-color 0.2s, box-shadow 0.2s;
  box-shadow: 0 4px 20px rgba(0,0,0,0.07);
}

.composer:focus-within {
  border-color: rgba(52,104,232,0.45);
  box-shadow: 0 4px 24px rgba(52,104,232,0.1);
}

textarea {
  flex: 1;
  resize: none;
  border: none;
  outline: none;
  background: transparent;
  font-family: inherit;
  font-size: 15px;
  line-height: 1.55;
  min-height: 46px;
  max-height: 160px;
  padding: 11px 0;
  color: var(--text);
}

textarea::placeholder { color: #9ca3af; }

.send-btn {
  width: 42px;
  height: 42px;
  border-radius: 12px;
  border: none;
  background: var(--accent);
  color: #fff;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: opacity 0.15s, background 0.15s, transform 0.1s;
}

.send-btn:disabled { opacity: 0.35; cursor: not-allowed; }
.send-btn:not(:disabled):hover { background: #2554cc; transform: scale(1.04); }

.stop-btn {
  width: 42px;
  height: 42px;
  border-radius: 12px;
  border: none;
  background: #e53e3e;
  color: #fff;
  cursor: pointer;
  display: none;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: background 0.15s, transform 0.1s;
}
.stop-btn:hover { background: #c53030; transform: scale(1.04); }
.stop-btn.visible { display: flex; }

.disclaimer {
  text-align: center;
  font-size: 11px;
  color: #d0d0d8;
  margin-top: 9px;
  letter-spacing: 0.01em;
}

@media (max-width: 720px) {
  .row-inner { padding: 0 12px; }
  .composer-wrap { padding: 10px 12px 16px; }
  .bubble-col { max-width: 90%; }
  .avatar { width: 54px; height: 54px; }
}

/* Markdown-embedded images inside AI bubbles also become clickable */
.row.ai .bubble img {
  max-width: 100%;
  height: auto;
  border-radius: 10px;
  cursor: zoom-in;
  margin: 6px 0;
  transition: opacity 0.15s;
}
.row.ai .bubble img:hover { opacity: 0.9; }

.generated-image-wrap {
  margin-top: 12px;
  border-radius: 14px;
  overflow: hidden;
  border: 1px solid var(--border);
  box-shadow: 0 4px 20px rgba(0,0,0,0.08);
  display: inline-block;
}
.generated-image-wrap img {
  display: block;
  width: 100%;
  max-width: 480px;
  height: auto;
  border-radius: 14px;
  cursor: zoom-in;
  transition: opacity 0.15s;
}
.generated-image-wrap img:hover { opacity: 0.9; }
.generated-image-label {
  font-size: 11px;
  color: var(--muted);
  margin-top: 6px;
  padding: 0 2px;
}
.lightbox-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.85);
  z-index: 9999;
  align-items: center;
  justify-content: center;
  cursor: zoom-out;
  backdrop-filter: blur(6px);
}
.lightbox-overlay.open {
  display: flex;
  animation: lbFadeIn 0.18s ease;
}
@keyframes lbFadeIn {
  from { opacity: 0; }
  to   { opacity: 1; }
}
.lightbox-img {
  max-width: 92vw;
  max-height: 92vh;
  border-radius: 12px;
  box-shadow: 0 24px 80px rgba(0,0,0,0.5);
  object-fit: contain;
  animation: lbZoomIn 0.18s ease;
  cursor: default;
}
@keyframes lbZoomIn {
  from { transform: scale(0.93); opacity: 0; }
  to   { transform: scale(1);    opacity: 1; }
}
.lightbox-close {
  position: fixed;
  top: 18px;
  right: 22px;
  width: 38px;
  height: 38px;
  border-radius: 50%;
  border: none;
  background: rgba(255,255,255,0.15);
  color: #fff;
  font-size: 22px;
  line-height: 1;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.15s;
}
.lightbox-close:hover { background: rgba(255,255,255,0.28); }

</style>
</head>

<body>
<div class="main">

  <!-- Top bar -->
  <div class="topbar">
    <button class="settings-btn" id="settingsBtn" type="button">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none">
        <circle cx="8" cy="8" r="2.5" stroke="currentColor" stroke-width="1.5"/>
        <path d="M8 1v2M8 13v2M1 8h2M13 8h2M3.05 3.05l1.41 1.41M11.54 11.54l1.41 1.41M3.05 12.95l1.41-1.41M11.54 4.46l1.41-1.41" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      Filter types
      <span class="filter-badge" id="filterBadge" style="display:none"></span>
    </button>
  </div>

  <div id="welcome" class="welcome">
    <img class="welcome-logo" src="https://pub-8939815d296142478477e03f7a08e392.r2.dev/assets/viseon.png" alt="Ask" />
    <h2>How can I help?</h2>
    <p>Ask me anything about the wonders of mathematics!</p>
    <div class="filter-notice" id="filterNotice">
      <svg width="13" height="13" viewBox="0 0 16 16" fill="none"><path d="M1 3h14M4 8h8M7 13h2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      Filtering by <span id="filterNoticeText"></span>
    </div>
  </div>

  <div id="msgs" class="msgs"></div>

  <div class="composer-wrap">
    <div class="composer-inner">
      <div class="composer">
        <textarea id="q" placeholder="Ask anything" rows="1"></textarea>
		<button class="send-btn" id="send" type="button" aria-label="Send">
		  <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
			<path d="M8 13V3M8 3L3.5 7.5M8 3L12.5 7.5" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
		  </svg>
		</button>
		<button class="stop-btn" id="stop" type="button" aria-label="Stop">
		  <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
			<rect x="2" y="2" width="10" height="10" rx="2" fill="white"/>
		  </svg>
		</button>
      </div>
      <div class="disclaimer">Responses are AI-generated and may not always be accurate.</div>
    </div>
  </div>

</div>

<!-- Settings Modal -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-header">
      <div>
        <h3 id="modalTitle">Filter by Schema Type</h3>
        <p>Select which entity types to include in search. Default is all types.</p>
      </div>
      <button class="modal-close" id="modalClose" aria-label="Close">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
          <path d="M12 4L4 12M4 4l8 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </button>
    </div>

    <div class="modal-actions-top">
      <button class="modal-action-link" id="selectAll">Select all</button>
      <button class="modal-action-link" id="selectNone">Clear all</button>
    </div>

    <div class="modal-body" id="modalBody">
      <!-- checkboxes injected by JS -->
    </div>

    <div class="modal-footer">
      <div class="modal-footer-note" id="footerNote">All types selected</div>
      <button class="btn-apply" id="applyBtn">Apply</button>
    </div>
  </div>
</div>

<script>

const ASK_ENDPOINT = "/api/gdayjames-v4";
const INSTRUCTIONS_ENDPOINT = "/api/gdayjames-instructions";
const LOGO_URL = "https://pub-8939815d296142478477e03f7a08e392.r2.dev/assets/viseon.png";

// Fetch custom instructions once on load; included in every ask request
let customInstructions = "";
(async () => {
  try {
    const res = await fetch(INSTRUCTIONS_ENDPOINT, { method: "GET" });
    if (res.ok) {
      const data = await res.json().catch(() => ({}));
      customInstructions = String(data.instructions || "").trim();
    }
  } catch {
    // silently ignore — falls back to worker default prompt
  }
})();

// ── All schema types hardcoded from nodes.json ──
const ALL_SCHEMA_TYPES = [
  { type: "Person",                            desc: "People & individuals" },
  { type: "Organization",                      desc: "Organisations & institutions" },
  { type: "NGO",                               desc: "Non-governmental organisations" },
  { type: "EducationalOrganization",           desc: "Schools, universities" },
  { type: "EducationalOccupationalCredential", desc: "Degrees & qualifications" },
  { type: "Book",                              desc: "Books & publications" },
  { type: "CreativeWorkSeries",                desc: "Book or media series" },
  { type: "CreativeWork | LearningResource",   desc: "Learning materials" },
  { type: "Course",                            desc: "Courses & programmes" },
  { type: "Service",                           desc: "Services offered" },
  { type: "Event",                             desc: "Events & appearances" },
  { type: "VideoObject",                       desc: "Videos & recordings" },
  { type: "WebApplication | LearningResource", desc: "Web apps & tools" },
  { type: "WebSite",                           desc: "Websites" },
  { type: "WebPage",                           desc: "Individual web pages" },
  { type: "ProfilePage",                       desc: "Profile pages" },
  { type: "CollectionPage",                    desc: "Collection & listing pages" },
  { type: "FAQPage",                           desc: "FAQ pages" },
  { type: "ContactPage",                       desc: "Contact pages" },
  { type: "ContactPoint",                      desc: "Contact details" },
  { type: "Place",                             desc: "Locations & places" },
  { type: "DefinedTerm",                       desc: "Defined terms & concepts" },
  { type: "DefinedTermSet",                    desc: "Sets of defined terms" },
  { type: "PropertyValue",                     desc: "Properties & attributes" },
  { type: "AssessAction",                      desc: "Assessment actions" },
  { type: "CreateAction",                      desc: "Creation actions" },
  { type: "InteractAction",                    desc: "Interaction actions" },
  { type: "SolveMathAction",                   desc: "Maths solving actions" },
  { type: "UpdateAction",                      desc: "Update actions" },
];

// ── State ──
let selectedTypes = new Set(ALL_SCHEMA_TYPES.map(s => s.type)); // all selected by default
let appliedTypes  = new Set(ALL_SCHEMA_TYPES.map(s => s.type)); // what's actually in effect

const elMsgs        = document.getElementById("msgs");
const elQ           = document.getElementById("q");
const elSend        = document.getElementById("send");
const elWelcome     = document.getElementById("welcome");
const elModalOverlay = document.getElementById("modalOverlay");
const elModalClose  = document.getElementById("modalClose");
const elModalBody   = document.getElementById("modalBody");
const elApplyBtn    = document.getElementById("applyBtn");
const elSelectAll   = document.getElementById("selectAll");
const elSelectNone  = document.getElementById("selectNone");
const elFilterBadge = document.getElementById("filterBadge");
const elFilterNotice = document.getElementById("filterNotice");
const elFilterNoticeText = document.getElementById("filterNoticeText");
const elFooterNote  = document.getElementById("footerNote");

const CHAT_SESSION_ID_KEY = "gdayjames_chat_session_id";

let history = [];
let pendingEl = null;
let hasStarted = false;
let isSending = false;
let currentAbortController = null;
let lastSendTime = 0;

const SEND_COOLDOWN_MS = 2000;


function getChatSessionId() {
  let id = sessionStorage.getItem(CHAT_SESSION_ID_KEY);
  if (!id) {
    id = crypto.randomUUID();
    sessionStorage.setItem(CHAT_SESSION_ID_KEY, id);
  }
  return id;
}

// ── Build modal checkboxes ──
function buildCheckboxes() {
  elModalBody.innerHTML = "";
  for (const { type, desc } of ALL_SCHEMA_TYPES) {
    const item = document.createElement("label");
    item.className = "schema-type-item";

    const cb = document.createElement("input");
    cb.type = "checkbox";
    cb.value = type;
    cb.checked = selectedTypes.has(type);
    cb.addEventListener("change", () => {
      if (cb.checked) selectedTypes.add(type);
      else selectedTypes.delete(type);
      updateFooterNote();
    });

    const labelText = document.createElement("span");
    labelText.className = "schema-type-label";
    labelText.textContent = type;

    const descText = document.createElement("span");
    descText.className = "schema-type-desc";
    descText.textContent = desc;

    item.appendChild(cb);
    item.appendChild(labelText);
    item.appendChild(descText);
    elModalBody.appendChild(item);
  }
  updateFooterNote();
}

function updateFooterNote() {
  const n = selectedTypes.size;
  const total = ALL_SCHEMA_TYPES.length;
  if (n === total) {
    elFooterNote.innerHTML = "All types selected";
  } else if (n === 0) {
    elFooterNote.innerHTML = "<span>No types selected</span> — will search all";
  } else {
    elFooterNote.innerHTML = `<span>${n}</span> of ${total} types selected`;
  }
}

function updateFilterBadge() {
  const total = ALL_SCHEMA_TYPES.length;
  const isFiltered = appliedTypes.size < total;
  if (isFiltered) {
    elFilterBadge.textContent = appliedTypes.size;
    elFilterBadge.style.display = "inline-flex";
    // Show notice on welcome screen
    const names = [...appliedTypes].slice(0, 3).join(", ");
    const extra = appliedTypes.size > 3 ? ` +${appliedTypes.size - 3} more` : "";
    elFilterNoticeText.textContent = `${names}${extra}`;
    elFilterNotice.classList.add("visible");
  } else {
    elFilterBadge.style.display = "none";
    elFilterNotice.classList.remove("visible");
  }
}

// ── Modal open/close ──
function openModal() {
  // Sync checkboxes to currently applied state before opening
  selectedTypes = new Set(appliedTypes);
  buildCheckboxes();
  elModalOverlay.classList.add("open");
  document.body.style.overflow = "hidden";
}

function closeModal() {
  elModalOverlay.classList.remove("open");
  document.body.style.overflow = "";
}

document.getElementById("settingsBtn").addEventListener("click", openModal);
elModalClose.addEventListener("click", closeModal);
elModalOverlay.addEventListener("click", (e) => {
  if (e.target === elModalOverlay) closeModal();
});

elSelectAll.addEventListener("click", () => {
  selectedTypes = new Set(ALL_SCHEMA_TYPES.map(s => s.type));
  buildCheckboxes();
});

elSelectNone.addEventListener("click", () => {
  selectedTypes = new Set();
  buildCheckboxes();
});

elApplyBtn.addEventListener("click", () => {
  // If nothing selected, treat as "all" (unfiltered)
  appliedTypes = selectedTypes.size === 0
    ? new Set(ALL_SCHEMA_TYPES.map(s => s.type))
    : new Set(selectedTypes);
  updateFilterBadge();
  closeModal();
});

// ── Chat helpers ──
function formatTime() {
  return new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
}

function scrollToBottom() {
  elMsgs.scrollTop = elMsgs.scrollHeight;
}

function autosize() {
  elQ.style.height = "auto";
  elQ.style.height = Math.min(elQ.scrollHeight, 160) + "px";
}

function hideWelcome() {
  if (hasStarted) return;
  hasStarted = true;
  elWelcome.classList.add("hidden");
  elMsgs.style.display = "flex";
}

function makeRow(role) {
  const row = document.createElement("div");
  row.className = "row " + (role === "assistant" ? "ai" : "me");

  const inner = document.createElement("div");
  inner.className = "row-inner";

  if (role === "assistant") {
    const avatar = document.createElement("div");
    avatar.className = "avatar";
    const img = document.createElement("img");
    img.src = LOGO_URL;
    img.alt = "Assistant";
    avatar.appendChild(img);
    inner.appendChild(avatar);
  }

  const col = document.createElement("div");
  col.className = "bubble-col";

  const bubble = document.createElement("div");
  bubble.className = "bubble";

  const time = document.createElement("div");
  time.className = "msg-time";
  time.textContent = formatTime();

  col.appendChild(bubble);
  col.appendChild(time);
  inner.appendChild(col);
  row.appendChild(inner);

  return { row, bubble };
}

// ── Markdown rendering ──────────────────────────────────────────────
// Configure marked to handle single newlines as <br> (chat-style), and
// GitHub-flavoured features (tables, strikethrough, task lists). All
// output is passed through DOMPurify before being injected as HTML,
// so that model-generated markup can't smuggle in <script>, <iframe>,
// on*= handlers, or javascript: URLs.
if (typeof marked !== "undefined" && marked.setOptions) {
  marked.setOptions({
    breaks: true,   // single newline -> <br>
    gfm: true,      // tables, strikethrough, autolinks
  });
}
function renderMarkdown(text) {
  const html = (typeof marked !== "undefined")
    ? marked.parse(text || "")
    : String(text || "");
  if (typeof DOMPurify !== "undefined") {
    return DOMPurify.sanitize(html, { ADD_ATTR: ["target", "rel"] });
  }
  return html;
}

// Attach sources + generated image to an existing assistant bubble.
// Factored out so it can be called either at render-time (non-streaming) or
// once the final "meta" frame arrives (streaming).
function attachSourcesAndImage(bubble, sources, generatedImageUrl) {
  if (Array.isArray(sources) && sources.length) {
    const meta = document.createElement("div");
    meta.className = "meta";

    const title = document.createElement("div");
    title.textContent = "Sources:";
    title.style.fontWeight = "600";
    title.style.marginBottom = "4px";
    meta.appendChild(title);

    for (const u of sources) {
      const safe = String(u || "").trim();
      if (!safe) continue;
      const a = document.createElement("a");
      a.href = safe;
      a.target = "_blank";
      a.rel = "noopener noreferrer";
      a.textContent = `- ${safe}`;
      a.style.display = "block";
      meta.appendChild(a);
    }

    bubble.appendChild(meta);
  }

  if (generatedImageUrl) {
    const wrap = document.createElement("div");
    wrap.className = "generated-image-wrap";
    const img = document.createElement("img");
    img.src = generatedImageUrl;
    img.alt = "Reference Image";
    img.loading = "lazy";
    wrap.appendChild(img);
    bubble.appendChild(wrap);
    const label = document.createElement("div");
    label.className = "generated-image-label";
    label.textContent = "Reference Image";
    bubble.appendChild(label);
  }
}

function addMessage(role, text, sources = [], generatedImageUrl = null) {
  const { row, bubble } = makeRow(role);

  if (role === "assistant") {
    bubble.innerHTML = renderMarkdown(text);
  } else {
    bubble.textContent = text || "";
  }

  if (role === "assistant") {
    attachSourcesAndImage(bubble, sources, generatedImageUrl);
  }

  elMsgs.appendChild(row);
  scrollToBottom();
  return row;
}

// Add an empty assistant bubble and return handles for streaming tokens into
// it. Markdown is re-rendered from the full concatenated buffer on each call
// to `appendToken` (throttled via requestAnimationFrame so we don't re-parse
// on every single token arrival). Call `finalize(sources, imageUrl)` when
// the stream completes to attach sources/image and do a final render.
function addStreamingMessage() {
  const { row, bubble } = makeRow("assistant");
  // Content sub-element so sources/image can live as siblings at the end.
  const content = document.createElement("div");
  content.className = "streaming-content";
  bubble.appendChild(content);

  elMsgs.appendChild(row);
  scrollToBottom();

  let buf = "";
  let pendingRender = false;
  let finalized = false;

  function renderNow() {
    content.innerHTML = renderMarkdown(buf);
    scrollToBottom();
  }

  function appendToken(t) {
    if (!t || finalized) return;
    buf += t;
    if (pendingRender) return;
    pendingRender = true;
    requestAnimationFrame(() => {
      pendingRender = false;
      renderNow();
    });
  }

  function finalize(sources, generatedImageUrl) {
    finalized = true;
    // Ensure the last batch of tokens is flushed before attaching extras.
    renderNow();
    attachSourcesAndImage(bubble, sources || [], generatedImageUrl || null);
    scrollToBottom();
  }

  return {
    row,
    bubble,
    appendToken,
    finalize,
    getText: () => buf,
  };
}

function addPending() {
  const { row, bubble } = makeRow("assistant");
  bubble.classList.add("pending-bubble");
  bubble.innerHTML = `
    <div class="pending">
      <div class="pending-logo">
        <img src="https://viseon.io/wp-content/uploads/2025/10/ask_.avif" alt="Thinking">
        <img src="https://gdaymath.com/wp-content/themes/gdaymath/images/logo.png" alt="Thinking">
      </div>
    </div>
  `;
  elMsgs.appendChild(row);
  scrollToBottom();
  pendingEl = row;
}

function removePending() {
  if (pendingEl && pendingEl.parentNode) {
    pendingEl.parentNode.removeChild(pendingEl);
  }
  pendingEl = null;
}

const elStop = document.getElementById("stop");

function setSendingState(sending) {
  isSending = sending;
  elSend.disabled = sending;
  if (sending) {
    elStop.classList.add("visible");
  } else {
    elStop.classList.remove("visible");
    currentAbortController = null;
  }
}

// ── Send message ──
async function sendMessage() {
  const now = Date.now();   
  if (now - lastSendTime < SEND_COOLDOWN_MS) return;   
  lastSendTime = now;
  const question = elQ.value.trim();
  if (!question || isSending) return;

  hideWelcome();
  addMessage("user", question);
// NOTE: do NOT push to `history` yet — the worker expects `history` to contain
// only PRIOR turns, and adds the current `question` itself. We push after the
// request body is built.

  elQ.value = "";
  autosize();
  setSendingState(true);
  addPending();

// Build entity_types filter — only send if not all selected
  const isFiltered = appliedTypes.size < ALL_SCHEMA_TYPES.length;
  const entityTypesFilter = isFiltered ? [...appliedTypes] : null;

  try {
    const body = { question, history: history.slice(-10), stream: true, session_id: getChatSessionId() };
    if (entityTypesFilter) body.entity_types = entityTypesFilter;
    if (customInstructions) body.custom_instructions = customInstructions;

    // Now record the user turn for future requests.
    history.push({ role: "user", content: question });
  
    currentAbortController = new AbortController();

    const res = await fetch(ASK_ENDPOINT, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Accept": "text/event-stream, application/json",
      },
      body: JSON.stringify(body),
      signal: currentAbortController.signal,
    });

    const contentType = (res.headers.get("content-type") || "").toLowerCase();
    const isStream = contentType.includes("text/event-stream") && res.body;

    // ── JSON fallback path ────────────────────────────────────────────
    // The worker returns JSON if streaming wasn't requested OR if an
    // error occurred before streaming started (e.g. embedding failure,
    // vectorize failure, no matches). Handle it the old way.
    if (!isStream) {
      const data = await res.json().catch(() => ({}));
      removePending();

      // The v4 endpoint returns { response, answer, mode, state, ... } with no
      // `ok` field. The v3 endpoint returns { ok: true, answer, used_docs, ... }.
      // Treat the response as successful if HTTP is OK AND we have either an
      // answer/response string OR an explicit ok:true. Only flag an error when
      // there's a real error field or the HTTP status is bad.
      const answerText = data.answer || data.response || "";
      const hasError = !res.ok || data.ok === false || (!answerText && (data.error || data.detail));

      if (hasError) {
        const errorText = data.detail || data.error || "Error retrieving response.";
        addMessage("assistant", errorText);
        history.push({ role: "assistant", content: errorText });
        return;
      }

      const answer = String(answerText || "No answer found.");
      const generatedImageUrl = data.generated_image_url || null;
      const used = Array.isArray(data.used_docs) ? data.used_docs : [];
      const sources = (() => {
        if (!used.length) return [];
        const top = used[0];
        if (top.url) return [top.url.split("#")[0]];
        if (top.entity_id) return [top.entity_id.split("#")[0]];
        return [];
      })();

      addMessage("assistant", answer, sources, generatedImageUrl);
      history.push({ role: "assistant", content: answer });
      return;
    }

    // ── Streaming path ────────────────────────────────────────────────
    // NOTE: we intentionally DO NOT remove the pending indicator or create
    // the assistant bubble yet. The response headers arrive well before the
    // first token (model warm-up can be a few hundred ms). If we created
    // the bubble now, the user would see an empty grey bubble before any
    // text appears. Instead, we defer both actions until the first `token`
    // event arrives — so the pending animation plays seamlessly right up
    // to the moment the first word renders.
    let streamMsg = null;
    const ensureBubble = () => {
      if (streamMsg) return;
      removePending();
      streamMsg = addStreamingMessage();
    };

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";
    let metaPayload = null;
    let streamError = null;

    // Parse SSE events: each event is separated by a blank line.
    // Within an event, lines beginning "event:" and "data:" carry metadata.
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });

      const events = buffer.split("\n\n");
      buffer = events.pop() ?? "";

      for (const evt of events) {
        if (!evt.trim()) continue;
        let eventName = "message";
        let dataStr = "";
        for (const rawLine of evt.split("\n")) {
          if (rawLine.startsWith("event:")) {
            eventName = rawLine.slice(6).trim();
          } else if (rawLine.startsWith("data:")) {
            // Multi-line data fields concatenate per SSE spec.
            dataStr += (dataStr ? "\n" : "") + rawLine.slice(5).trim();
          }
        }
        if (!dataStr) continue;

        let data;
        try { data = JSON.parse(dataStr); } catch { continue; }

        if (eventName === "token") {
          const t = data.t || "";
          if (t) {
            ensureBubble();
            streamMsg.appendToken(t);
          }
        } else if (eventName === "meta") {
          metaPayload = data;
        } else if (eventName === "error") {
          streamError = data.error || "Streaming error";
        }
      }
    }

    // Edge case: stream ended without producing any tokens (e.g. the model
    // returned an empty response, or only a meta/error frame fired). Fall
    // back to whatever `meta.answer` holds, or an error message, so the
    // pending bubble doesn't get stuck on screen.
    if (!streamMsg) {
      removePending();
      const fallback =
        streamError
          ? `Error: ${streamError}`
          : (metaPayload && metaPayload.answer) || "No answer found.";
      streamMsg = addStreamingMessage();
      streamMsg.appendToken(fallback);
    }

    // Finalise the bubble with sources / image from the meta frame.
    const finalText = (metaPayload && metaPayload.answer) || streamMsg.getText() || "No answer found.";
    const generatedImageUrl = metaPayload ? (metaPayload.generated_image_url || null) : null;
    const used = metaPayload && Array.isArray(metaPayload.used_docs) ? metaPayload.used_docs : [];
    const sources = (() => {
      if (!used.length) return [];
      const top = used[0];
      if (top.url) return [top.url.split("#")[0]];
      if (top.entity_id) return [top.entity_id.split("#")[0]];
      return [];
    })();

    streamMsg.finalize(sources, generatedImageUrl);

    if (streamError) {
      history.push({ role: "assistant", content: `Error: ${streamError}` });
    } else {
      history.push({ role: "assistant", content: finalText });
    }

  } catch (err) {
    removePending();
    if (err.name === "AbortError") return; // user cancelled — no error message
    const errorText = "Error retrieving response.";
    addMessage("assistant", errorText);
    history.push({ role: "assistant", content: errorText });
  } finally {
    setSendingState(false);
    elQ.focus();
  }
}

elSend.addEventListener("click", sendMessage);
elQ.addEventListener("input", autosize);
elQ.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});
elStop.addEventListener("click", () => {
  if (currentAbortController) currentAbortController.abort();
});

// Keyboard close
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") closeModal();
});

autosize();
updateFilterBadge();

// ── Lightbox ──────────────────────────────────────────────────────────────────
document.addEventListener("DOMContentLoaded", function() {
  const overlay = document.getElementById("lightboxOverlay");
  const lbImg   = document.getElementById("lightboxImg");
  const lbClose = document.getElementById("lightboxClose");

  if (!overlay || !lbImg || !lbClose) {
    console.warn("[lightbox] overlay elements missing from DOM");
    return;
  }

  function openLightbox(src, alt) {
    lbImg.src = src;
    lbImg.alt = alt || "";
    overlay.classList.add("open");
    document.body.style.overflow = "hidden";
  }

  function closeLightbox() {
    overlay.classList.remove("open");
    document.body.style.overflow = "";
    setTimeout(() => { lbImg.src = ""; }, 200);
  }

  lbClose.addEventListener("click", closeLightbox);
  overlay.addEventListener("click", (e) => {
    if (e.target === overlay) closeLightbox();
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") closeLightbox();
  });

  document.addEventListener("click", (e) => {
    const img = e.target.closest(".row.ai .bubble img");
    if (img && !img.closest(".avatar")) {
      openLightbox(img.src, img.alt);
    }
  });
});

</script>

<div id="lightboxOverlay" class="lightbox-overlay" role="dialog" aria-modal="true" aria-label="Image viewer">
  <button class="lightbox-close" id="lightboxClose" aria-label="Close">&times;</button>
  <img id="lightboxImg" class="lightbox-img" src="" alt="" />
</div>
</body>
</html>
