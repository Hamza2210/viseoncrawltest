name = "new-website-deploy"
compatibility_date = "2026-08-01"
# The site's files are served as they always were; worker.js only answers /dq-api/* (UAT's API, passed through, so
# the portal's sign-in cookie is this site's own; see worker.js).
main = "worker.js"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/dq-api/*"]
